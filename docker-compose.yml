services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    command: >
      streamlit run dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data/processed:/app/data/processed
    environment:
      PYTHONPATH: /app
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  mlflow:
    build: .
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri file:///app/mlruns
      --default-artifact-root file:///app/mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"

  train:
    profiles: ["train"]
    build: .
    command: python notebooks/test_pipeline.py
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ALLOW_FILE_STORE: "true"
      SAMPLE_ROWS: ${SAMPLE_ROWS:-}
    depends_on:
      - mlflow
